worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

# === START: [2026-10-28] Маршрутизация SNI (L4 stream) с разделением трафика ===
stream {
    log_format basic '[$time_iso8601] From $remote_addr $protocol $status to $ssl_preread_server_name $upstream_addr sent $bytes_sent b, received $bytes_received b in $session_time';
    access_log /dev/stdout basic;

    map_hash_bucket_size 256;

    geo $remote_addr $is_banned {
        default 0;
        include /etc/nginx/banned_ips.conf; 
    }

    # Белый список доменов SNI-прокси (роутеры)
    map $ssl_preread_server_name $allowed_domain {
        include /etc/nginx/whitelist_domains.conf;
        default 0;
    }

    # Маршрутизация трафика, не входящего в белый список:
    # - Трафик Reality с целевым SNI -> в Xray на 127.0.0.1:8443
    # - Всё остальное (наш домен, прямой заход по IP, сканеры) -> в локальный HTTP на 127.0.0.1:8083
    map $ssl_preread_server_name $custom_backend {
        "__REALITY_SNI__"   127.0.0.1:8443;
        default             127.0.0.1:8083;
    }

    map "$allowed_domain:$is_banned" $upstream {
        "1:0"   $ssl_preread_server_name:443;
        default $custom_backend;
    }

    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 9.9.9.9 149.112.112.112 208.67.222.222 ipv6=off valid=30s;

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 20m;
    }
}
# === END: [2026-10-28] Маршрутизация SNI (L4 stream) с разделением трафика ===

# === START: [2026-10-28] Веб-сервер маскировки и реверс-прокси панели 3X-UI (L7 http) ===
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '[$time_iso8601] $remote_addr - "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip сжатие статики сайта-маскировки
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Порт 80: продление ACME-сертификатов и 301 редирект на HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Локальный HTTPS сервер (принимает входящий трафик от stream с порта 443)
    server {
        listen 127.0.0.1:8083 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl_active/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl_active/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Реверс-прокси для скрытой панели 3X-UI (путь подставляется из XUI_PATH в entrypoint.sh)
        location __XUI_BASE_PATH__ {
            proxy_pass http://127.0.0.1:53273;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Белый сайт-маскировка (любые внешние запросы и сканеры)
        location / {
            root /var/www/camouflage;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /index.html;
    }
}
# === END: [2026-10-28] Веб-сервер маскировки и реверс-прокси панели 3X-UI (L7 http) ===
